<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Signup complete</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at 50% 0%, #39107b38, transparent 42%), #000; color: #f5f3f2; font-family: "DM Sans", sans-serif; }
        main { width: min(100%, 560px); padding: 36px; border: 1px solid #ffffff20; border-radius: 20px; background: linear-gradient(145deg, #111, #080808); box-shadow: 0 24px 70px #000, 0 0 45px #39107b24; }
        h1 { margin-top: 0; font: 600 32px/1.2 "Space Grotesk", sans-serif; }
        strong { color: #e6a17d; }
        a { display: inline-block; margin-top: 12px; padding: 12px 18px; border-radius: 9px; background: #a14214; color: white; font-weight: 700; text-decoration: none; }
        a:hover { background: #eb3324; }
        img { border-radius: 12px; }
    </style>
</head>
<body>
    <main>
        <h1>Signup complete</h1>
        <p>Your information was submitted successfully.</p>
        {% if employee %}
        <p>Name: <strong>{{ employee.name }}</strong></p>
        <p>Department: <strong>{{ employee.department }}</strong></p>
        <p>Employee ID: <strong>{{ employee.employee_id }}</strong></p>
        {% if employee.photo_url %}
        <p>Photo:</p>
        <img src="{{ employee.photo_url }}" alt="Photo of {{ employee.name }}" width="160">
        {% endif %}
        {% endif %}
        <a href="{% url 'body:index' %}">Go to Homepage</a>
    </main>
</body>
</html>

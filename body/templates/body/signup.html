<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign up</title>
    <style>
        body {
            margin: 0;
            background: #000;
            color: #fff;
            font-family: Inter, "Segoe UI", sans-serif;
        }
        .logo-wrap {
            width: min(100%, 980px);
            margin: 28px auto 0;
            display: flex;
            justify-content: center;
        }
        .brand-logo-svg {
            width: min(100%, 1180px);
            height: auto;
            display: block;
        }
        main {
            max-width: 520px;
            margin: 20px auto 52px;
            padding: 24px 26px 28px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 18px;
        }
        h1 {
            margin-top: 0;
            color: #fff;
        }
        form {
            display: grid;
            gap: 12px;
        }
        input, select, textarea, button {
            width: 100%;
            box-sizing: border-box;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.16);
            font: inherit;
        }
        button {
            background: #0d4db8;
            color: white;
            font-weight: 700;
            border: none;
            cursor: pointer;
        }
        p, label {
            color: #e5e7eb;
        }
        a {
            color: #7db2ff;
        }
    </style>
</head>
<body>
    <div class="logo-wrap">
        {% include "body/brand_logo.html" %}
    </div>
    <main>
        <h1>Sign up</h1>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Submit</button>
        </form>
        <p>Already signed up? <a href="{% url 'body:login' %}">Log in</a></p>
    </main>
</body>
</html>
